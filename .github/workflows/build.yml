name: build-friends-json

# 合并 PR 后重新聚合 friends.json 并提交，保证仓库根目录的聚合文件始终是最新的。
# 站点构建时通过 GitHub API 读取的就是这个文件。

on:
  push:
    branches: [main]
    paths:
      - "data/friends/**"
      - "scripts/build.js"
      - "config/site.json"

permissions:
  contents: write

concurrency:
  group: build-friends-json
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 重新聚合
        run: node scripts/build.js

      - name: 有变化才提交
        run: |
          if git diff --quiet -- friends.json; then
            echo "friends.json 无变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add friends.json
          git commit -m "chore: 重新生成 friends.json [skip ci]"
          git push
